<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#020408" name="theme-color"/>
<title>Registration Received | Couch To Cage</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&amp;display=swap" rel="stylesheet"/>
<style>
    :root{--black:#020408;--navy:#061426;--gold:#f3c541;--blue:#2f5f9b;--white:#f8fafc;--muted:#b3bdcb}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;overflow-x:hidden}
    body{font-family:Montserrat,system-ui,sans-serif;color:var(--white);background:radial-gradient(circle at 50% 0%,rgba(30,75,138,.22),transparent 30rem),linear-gradient(180deg,#07172a 0%,#020811 58%,#020408 100%)}
    .thank-you-page{min-height:100svh;display:grid;place-items:center;padding:28px 18px}
    .thank-you-card{width:min(760px,100%);padding:clamp(28px,7vw,64px);border:1px solid rgba(243,197,65,.4);border-radius:24px;background:linear-gradient(160deg,rgba(11,31,58,.96),rgba(2,7,15,.99));box-shadow:0 30px 100px rgba(0,0,0,.55);text-align:center}
    .thank-you-card img{display:block;width:min(230px,68%);height:auto;margin:0 auto 20px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.35))}
    .eyebrow{margin:0 0 14px;color:var(--gold);font-size:.78rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:0 0 22px;font-size:clamp(2.5rem,10vw,5.7rem);line-height:.92;font-weight:900;letter-spacing:-.05em;text-transform:uppercase}
    .lead{max-width:620px;margin:0 auto;color:var(--muted);font-size:clamp(1rem,3.8vw,1.2rem);line-height:1.75}
    .motto{margin:28px auto;padding:24px 18px;border-top:1px solid rgba(243,197,65,.38);border-bottom:1px solid rgba(243,197,65,.38);display:grid;gap:8px;text-transform:uppercase}
    .motto strong{font-size:clamp(1.15rem,5vw,1.65rem);font-weight:900;letter-spacing:.045em}
    .bleed{color:#fff}.blue{color:var(--blue)}.gold{color:var(--gold)}
    .button{min-height:54px;display:inline-flex;align-items:center;justify-content:center;padding:0 26px;border-radius:8px;color:#080808;background:linear-gradient(135deg,#fff0a7,var(--gold) 48%,#b77711);font-size:.84rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;box-shadow:0 15px 38px rgba(243,197,65,.2)}
  </style>
</head>
<body>
<main class="thank-you-page">
<section class="thank-you-card">
<img alt="CTC Couch To Cage" src="/assets/ctc-logo-transparent.png"/>
<p class="eyebrow">REGISTRATION RECEIVED</p>
<h1>YOU'RE ON OUR RADAR.</h1>
<p class="lead">Welcome to the Couch To Cage roster. We’ll review your profile and contact you when an opportunity matches.</p>
<div aria-label="Couch To Cage motto" class="motto">
<strong><span class="bleed">BLEED</span> <span class="blue">BLUE.</span></strong>
<strong class="gold">TOUCH GOLD.</strong>
</div>
<a class="button" href="/">Return Home</a>
</section>
</main>
</body>
</html>
