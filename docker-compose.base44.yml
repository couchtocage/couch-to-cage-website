# Base44 sandbox runbook for the CTC static site (Couch To Cage).
# Serves the repo as-is from the cloned source; no build step exists for this site.
services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: "Couch To Cage"
      base44.kind: "web"
      base44.port: "3000"
    command: ["node", "base44-dev-server.mjs"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    environment:
      - PORT=3000
      # Preview flag supplied by the platform; passthrough only (unset elsewhere).
      - BASE44_PREVIEW_MODE
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
